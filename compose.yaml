services:
  app:
    image: lihaozhe013/tradeflow-core:latest
    container_name: tradeflow-core-prod
    restart: always
    ports:
      - '8000:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./config:/workspace/config
      - ./cache:/workspace/cache
    environment:
      - NODE_ENV=production

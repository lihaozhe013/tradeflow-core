name: Build and release TradeFlow Connect

on:
  push:
    branches: [build-mcp-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradeflow-desktop-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate desktop app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop
      - name: Install desktop dependencies
        run: bun install --frozen-lockfile --filter @tradeflow/desktop
      - name: Build frontend
        run: bun run --cwd desktop web:build
      - name: Install Playwright browser
        run: bun run --cwd desktop playwright install --with-deps chromium
      - name: Test development UI
        run: bun run --cwd desktop test:ui
      - name: Test production icon with packaged CSP
        run: bun run --cwd desktop test:ui:production
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - name: Test desktop core
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p tradeflow-connect
      - name: Lint desktop core
        run:
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p tradeflow-connect
          --all-targets -- -D warnings
      - name: Test GitHub release publisher
        run: bun run --cwd desktop test:release

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: windows
            arch: arm64
            os: windows-2025
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - platform: macos
            arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: linux
            arch: x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TRADEFLOW_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop
          key: ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Prepare Visual Studio cross-compilation environment
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TRADEFLOW_MSVC_ARCH: ${{ matrix.arch }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio vswhere.exe was not found.' }
          $components = @('Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
          if ($env:TRADEFLOW_MSVC_ARCH -eq 'arm64') {
            $components += 'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          }
          $installPath = & $vswhere -latest -products '*' -requires $components -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ tools for $env:TRADEFLOW_MSVC_ARCH were not found." }
          $devShell = Join-Path $installPath 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
          $before = [Environment]::GetEnvironmentVariables()
          Import-Module $devShell
          $targetArch = if ($env:TRADEFLOW_MSVC_ARCH -eq 'arm64') { 'arm64' } else { 'amd64' }
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments "-arch=$targetArch -host_arch=amd64" | Out-Null
          $after = [Environment]::GetEnvironmentVariables()
          foreach ($name in $after.Keys) {
            if ($name -match '^(GITHUB_|RUNNER_)' -or $name -eq 'TRADEFLOW_MSVC_ARCH') { continue }
            $value = [string]$after[$name]
            if ($before[$name] -ne $value -and $value -notmatch '[\r\n]') {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8NoBOM
            }
          }
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file libayatana-appindicator3-dev libfuse2t64 libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Install desktop dependencies
        run: bun install --frozen-lockfile --filter @tradeflow/desktop
      - name: Build installers
        run:
          bun run --cwd desktop build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles
          }}
      - name: Collect Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -Path "desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe" -File)
          if ($installer.Count -ne 1) { throw "Expected one ${{ matrix.arch }} NSIS installer; found $($installer.Count)." }
          $destination = Join-Path $env:RUNNER_TEMP 'tradeflow-desktop-release'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item $installer[0].FullName (Join-Path $destination 'tradeflow-connect-windows-${{ matrix.arch }}.exe')
          $sidecar = "desktop/src-tauri/binaries/tradeflow-connect-${{ matrix.target }}.exe"
          if (-not (Test-Path $sidecar)) { throw "The ${{ matrix.target }} MCP sidecar is missing." }
      - name: Collect macOS installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          files=(desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          [[ ${#files[@]} -eq 1 ]]
          mkdir -p "$RUNNER_TEMP/tradeflow-desktop-release"
          cp "${files[0]}" "$RUNNER_TEMP/tradeflow-desktop-release/tradeflow-connect-macos-arm64.dmg"
          test -f "desktop/src-tauri/binaries/tradeflow-connect-${{ matrix.target }}"
      - name: Collect Linux installers
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          debs=(desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          images=(desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#images[@]} -eq 1 ]]
          mkdir -p "$RUNNER_TEMP/tradeflow-desktop-release"
          cp "${debs[0]}" "$RUNNER_TEMP/tradeflow-desktop-release/tradeflow-connect-linux-x64.deb"
          cp "${images[0]}" "$RUNNER_TEMP/tradeflow-desktop-release/tradeflow-connect-linux-x64.AppImage"
          test -f "desktop/src-tauri/binaries/tradeflow-connect-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tradeflow-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/tradeflow-desktop-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish single rolling pre-release
    if: github.ref == 'refs/heads/build-mcp-app'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tradeflow-desktop-*
          path: ${{ runner.temp }}/tradeflow-desktop-artifacts
          merge-multiple: true
      - name: Update the single desktop release and tag
        run: bun run desktop/scripts/publish-release.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRADEFLOW_DESKTOP_ARTIFACTS: ${{ runner.temp }}/tradeflow-desktop-artifacts

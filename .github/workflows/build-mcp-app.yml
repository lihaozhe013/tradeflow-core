name: Build MCP Windows app

on:
  push:
    branches: [build-mcp-app]

permissions:
  contents: read

concurrency:
  group: build-mcp-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc-arch: amd64
            cache-key: ''
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc-arch: amd64_arm64
            cache-key: windows-arm64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TRADEFLOW_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 26.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.cache-key }}
      - name: Install desktop dependencies
        run: bun install --frozen-lockfile --filter @tradeflow/desktop
      - name: Build Windows installer
        run: >-
          bun run --cwd desktop build -- --target ${{ matrix.target }} --bundles nsis --config
          src-tauri/tauri.windows-ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: tradeflow-connect-windows-${{ matrix.arch }}
          path: desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

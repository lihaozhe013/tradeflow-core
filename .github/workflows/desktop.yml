name: TradeFlow Connect test installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        'desktop/**',
        'frontend/src/i18n/locales/**',
        'bun.lock',
        '.github/workflows/desktop.yml',
        '.github/workflows/build-mcp-app.yml',
        '.github/workflows/build.yml'
      ]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg,app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop
      - run: bun install --frozen-lockfile
      - run: bun run --cwd desktop typecheck
      - run: bun run --cwd desktop playwright install chromium
      - run: bun run --cwd desktop test:ui
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - run: cargo test --locked --manifest-path desktop/Cargo.toml -p tradeflow-connect
      - run:
          cargo clippy --locked --manifest-path desktop/Cargo.toml -p tradeflow-connect
          --all-targets -- -D warnings
      - run:
          bun run --cwd desktop build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles
          }}
        env:
          TRADEFLOW_DESKTOP_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tradeflow-connect-test-${{ matrix.target }}
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/
            desktop/target/${{ matrix.target }}/release/tradeflow-connect*
          if-no-files-found: error

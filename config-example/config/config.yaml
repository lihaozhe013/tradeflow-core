currency_unit_symbol: '$'
pagination_limit: 20
database:
  type: postgresql
  host: host.docker.internal
  port: 5432
  user: postgres
  password: postgres
  dbName: tradeflow
  maxConnections: 5
  bootstrap:
    createDatabase: true
    maintenanceDatabase: postgres
    lockTimeoutMs: 30000
    statementTimeoutMs: 60000
auth:
  enabled: true
  tokenExpiresInHours: 12
  loginRateLimit:
    windowMinutes: 5
    maxAttempts: 20
  allowExportsForReader: true
mcp:
  enabled: true
  allowedHosts: []
  allowedOrigins: []
  requestsPerMinute: 60
  maxConcurrentRequests: 2
  maxConcurrentAnalysis: 1
  stagingWrites:
    enabled: true
  credentials: []
server:
  httpPort: 8000
frontend:
  hostByBackend: true
  distPath: ./frontend
  fallbackToIndex: true

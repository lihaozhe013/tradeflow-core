currency_unit_symbol: '$'
pagination_limit: 20
database:
  type: postgresql
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: replace-with-local-postgres-password
  dbName: tradeflow_e2e
  maxConnections: 5
  bootstrap:
    createDatabase: true
    maintenanceDatabase: postgres
    lockTimeoutMs: 30000
    statementTimeoutMs: 60000
auth:
  enabled: true
  tokenExpiresInHours: 12
  loginRateLimit:
    windowMinutes: 5
    maxAttempts: 1000
  allowExportsForReader: true
mcp:
  enabled: false
  allowedHosts: []
  allowedOrigins: []
  requestsPerMinute: 60
  maxConcurrentRequests: 2
  maxConcurrentAnalysis: 1
  credentials: []
server:
  httpPort: 18080
frontend:
  hostByBackend: false
  distPath: ./frontend
  fallbackToIndex: true
